id: checkmk-snmp-timeout
title: Checkmk - SNMP timeout ou sem resposta
priority: 98
profiles: [checkmk, oracle_linux, linux_generic, pfsense, fortigate]
match:
  any:
    - "snmp.*timeout"
    - "no snmp response"
    - "sem resposta.*snmp"
    - "snmp.*sem resposta"
    - "problema.*snmp"
    - "comunica.*snmp"
    - "snmp.*comunica"
    - "cannot fetch system description"
    - "porta 161"
    - "idrac"
    - "ilo"
    - "ilom"
    - "xclarity"
steps:
  - tool: checkmk.discover
    purpose: Descobrir containers Checkmk e sites OMD antes de consultar o host.
  - tool: network.interfaces
    purpose: Confirmar endereços e rotas existentes no servidor de monitoramento.
  - tool: network.inspect_route
    requires_context: objective_ip
    arguments: {host: "{{objective_ip}}"}
    purpose: Validar a rota utilizada até o equipamento SNMP informado.
  - tool: snmp.transport
    requires_context: objective_ip
    arguments: {host: "{{objective_ip}}"}
    purpose: Correlacionar rota, ICMP e UDP/161 sem assumir que open|filtered significa serviço funcional.
  - tool: snmp.auto.system
    requires_context: objective_ip
    arguments: {host: "{{objective_ip}}"}
    purpose: Tentar as credenciais SNMP v3/v2c protegidas do Agent e confirmar se existe resposta protocolar válida.
  - tool: checkmk.diagnose_snmp_address
    requires_context: objective_ip
    arguments: {address: "{{objective_ip}}"}
    purpose: Localizar o host pelo IP dentro do site OMD e executar cmk -vvn para comparar a visão do Checkmk com o teste direto.
allowed_corrections: []
validation:
  - tool: snmp.auto.system
    requires_context: objective_ip
    arguments: {host: "{{objective_ip}}"}
  - tool: checkmk.diagnose_snmp_address
    requires_context: objective_ip
    arguments: {address: "{{objective_ip}}"}
