services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-ia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_ia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_ia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ia -d agent_ia"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agent-ia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:latest}
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - ${OMNIROUTE_ENV_FILE:-./.omniroute.env}
    volumes:
      - omniroute_data:/app/data
    ports:
      - "${OMNIROUTE_BIND_ADDRESS:-127.0.0.1}:${OMNIROUTE_PORT:-20128}:20128"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:20128/').then(r =>
          process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  omniroute_data:
