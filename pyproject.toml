[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ia-infra"
version = "1.30.3"
description = "Agent IA para troubleshooting seguro de infraestrutura"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
agent = "app.cli.entrypoint:main"
agent-worker = "app.worker:main"
agent-web = "app.web_main:main"
agent-opencode = "app.services.opencode_cli:main"
agent-opencode-web = "app.services.opencode_cli:web_main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ui/*.html", "ui/*.css", "ui/*.js"]
