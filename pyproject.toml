[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ia-infra"
version = "1.47.5"
description = "Agent IA para troubleshooting seguro de infraestrutura"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[project.scripts]
agent = "app.cli.entrypoint:main"
agent-worker = "app.worker:main"
agent-web = "app.web_main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
