id: checkmk-systemd-socket-summary
title: Checkmk - Systemd Socket Summary
priority: 130
profiles: [checkmk, oracle_linux, linux_generic]
match:
  any:
    - "systemd\\s+socket\\s+summary"
    - "failed\\s+socket"
    - "socket.*failed"
    - "check_mk.*failed"
steps:
  - tool: systemd.list_failed
    purpose: Listar sockets e unidades em falha
  - tool: systemd.inspect_unit
    arguments: {unit: check-mk-agent.socket}
    purpose: Verificar a unidade atual do agente Checkmk
  - tool: systemd.inspect_unit
    arguments: {unit: check_mk.socket}
    purpose: Verificar a unidade legada do agente
  - tool: systemd.inspect_unit
    arguments: {unit: xinetd.service}
    purpose: Confirmar se o xinetd está ativo antes de decidir pela limpeza da unidade legada
  - tool: checkmk.inspect_agent_socket
    purpose: Identificar o dono da porta 6556 e validar a resposta funcional do agente
  - tool: journal.read_unit
    arguments: {unit: check_mk.socket, lines: 120}
    purpose: Confirmar por que a unidade legada entrou em FAILED
  - tool: journal.read_unit
    arguments: {unit: check-mk-agent.socket, lines: 120}
    purpose: Consultar o socket moderno quando ele existir
allowed_corrections:
  - checkmk.resolve_legacy_socket_conflict
  - systemd.recover_unit
validation:
  - tool: checkmk.inspect_agent_socket
