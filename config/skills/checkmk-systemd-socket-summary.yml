id: checkmk-systemd-socket-summary
title: Systemd Socket Summary - agente Checkmk
priority: 260
match:
  service:
    - '^Systemd Socket Summary$'
    - 'Systemd.*Socket.*Summary'
  output:
    - 'socket failed.*check_mk'
    - 'failed.*check_mk'
    - '1 socket failed'
    - 'check_mk.*CRIT'
  host: []
target_strategy: internal_ssh
playbook_id: checkmk-systemd-socket-summary
objective: Resolver o alerta Systemd Socket Summary distinguindo TARGET_HOST de MONITORING_HOST, corrigindo com segurança o mecanismo do agente na porta 6556 e obrigatoriamente executando uma nova coleta no Checkmk responsável antes de considerar o incidente resolvido.
knowledge:
  - TARGET_HOST é o servidor monitorado onde roda o Checkmk Agent; MONITORING_HOST é o servidor que possui Checkmk/OMD. Nunca assumir que são o mesmo host.
  - O alerta pode ser causado por uma unit legada check_mk.socket em FAILED enquanto o xinetd já possui a porta TCP 6556 e entrega o agente normalmente.
  - Em ocorrências já resolvidas, o conflito apareceu com xinetd ouvindo em 6556 e a unit legada falhando por porta ocupada e/ou configuração antiga como MaxConnectionsPerSource. Usar o journal para confirmar esse padrão.
  - Quando xinetd.service está ativo, xinetd é o dono da 6556, a resposta local contém <<<check_mk>>> e check_mk.socket está FAILED, a sequência comprovada é desabilitar/parar somente check_mk.socket, limpar o estado failed, garantir xinetd habilitado e reiniciar xinetd.
  - Depois da sequência comprovada, validar novamente xinetd ativo e habilitado, TCP/6556 pertencendo ao xinetd, resposta <<<check_mk>>> e ausência de check_mk.socket em systemctl --failed --type=socket.
  - Esta ocorrência possui fallback determinístico no código. Se o Ensemble/provedor de IA estiver indisponível, a aplicação usa somente ferramentas estruturadas da Skill e suas pré-condições; não depende de inferência para escolher os passos já conhecidos.
  - Se check-mk-agent.socket for o dono esperado da 6556 e estiver realmente em falha, usar a recuperação normal do socket moderno em vez da limpeza da unit legada.
  - Depois de corrigir e validar o agente no TARGET_HOST, o MONITORING_HOST do mesmo cliente deve conseguir abrir TCP/6556 e receber <<<check_mk>>> do TARGET_IP antes da coleta Checkmk.
  - No CHECKMK_SITE responsável, confirmar TARGET_HOST com cmk -D, limpar cache com cmk --flush e executar cmk --debug -vvn.
  - A coleta no MONITORING_HOST deve localizar exatamente um site contendo o TARGET_HOST. Zero ou múltiplas correspondências impedem encerramento automático.
  - Discovery não deve ser executado quando a coleta estiver falhando. cmk -II só é aceitável com coleta funcional e evidência de serviço novo/vanished ou necessidade real de redescoberta.
  - Código de retorno zero de uma correção local ou de um job não significa que o sensor foi resolvido. O estado final só é Resolvido quando o Livestatus/Checkmk confirmar o sensor em OK.
constraints:
  - Nunca desabilitar check_mk.socket sem confirmar antes que xinetd.service está ativo, que xinetd possui a porta 6556 e que o agente responde localmente com <<<check_mk>>>.
  - O fallback determinístico não ignora guardrails: exige ambiente elegível, ferramentas na allowlist NOC, rota site-scoped do mesmo cliente e todas as pré-condições do checkmk.resolve_legacy_socket_conflict.
  - Nunca executar omd/cmk no TARGET_HOST apenas porque ele está acessível; comandos Checkmk pertencem ao MONITORING_HOST/CHECKMK_SITE confirmado.
  - Não misturar sites, IPs internos ou sessões de clientes diferentes durante a procura do servidor de monitoramento.
  - Se a porta 6556 não responder localmente ou a partir do MONITORING_HOST, interromper o encerramento automático e manter o incidente aberto.
  - Se não for possível identificar MONITORING_HOST ou CHECKMK_SITE de forma única, marcar como requer análise humana.
  - Não reiniciar o servidor, não controlar containers e não acessar banco de dados do cliente.
